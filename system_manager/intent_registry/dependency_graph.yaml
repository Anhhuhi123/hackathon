# Dependency Graph
# Tracks dependencies between intents and between features within intents.
# Used by execution planner to determine task ordering and parallelization.

intent_dependencies:
  # intent-002 depends on intent-001 because profile page requires authentication
  - dependent: "intent-002"
    depends_on: "intent-001"
    dependency_type: "requires_completion"
    reason: "Profile page requires authenticated user, which is delivered by login intent"
    blocking: true

feature_dependencies:
  # Within intent-001: forgot_password depends on user_login (needs user table)
  - intent_id: "intent-001"
    dependent: "feat-002"
    depends_on: "feat-001"
    dependency_type: "shared_resource"
    shared_resource: "users table"
    blocking: false  # Can proceed in parallel since DB contract covers both

  # Within intent-001: input_validation is independent
  - intent_id: "intent-001"
    dependent: "feat-003"
    depends_on: null
    dependency_type: "none"
    blocking: false

# Parallelization rules:
#   - Features with no dependencies can execute in parallel
#   - Features with "shared_resource" dependency and blocking: false can execute in parallel
#     if the shared resource contract is already defined
#   - Features with blocking: true must wait for dependency completion
#   - Cross-intent dependencies always block

cross_cutting_concerns:
  - concern: "users_table"
    used_by_intents: ["intent-001", "intent-002"]
    contract_owner: "intent-001"
    status: "active"

  - concern: "jwt_auth_middleware"
    used_by_intents: ["intent-001", "intent-002"]
    contract_owner: "intent-001"
    status: "active"
