# Dependency Graph — Inter-Intent Relationships
#
# File này mô tả quan hệ phụ thuộc giữa các intents/features trong hệ thống.
# Architecture Layer sử dụng file này để:
#   1. Kiểm tra intent mới có phụ thuộc intent nào chưa COMPLETED không
#   2. Hiểu impact của một intent lên các intent khác
#   3. Tránh breaking changes với existing contracts
#
# FORMAT:
#   DEPENDENT_INTENT:
#     depends_on:
#       - REQUIRED_INTENT   # Ý nghĩa của dependency
#     impacts:
#       - AFFECTED_INTENT   # Intent nào bị ảnh hưởng nếu contract thay đổi
#
# RULE: Architecture Layer phải cập nhật file này mỗi khi tạo intent mới.

graph:
  EXAMPLE_001:
    depends_on: []
    impacts: []
    description: "Root intent — không phụ thuộc vào intent nào"

  USER_001:
    depends_on: []
    impacts: []
    description: "User authentication login page"

  DASHBOARD_001:
    depends_on:
      - LOGIN_001
    impacts:
      - LOGIN_001
    description: "Football betting dashboard after login"

  # Ví dụ về dependency chain thực tế:
  #
  # USER_001:
  #   depends_on:
  #     - AUTH_001    # User profile chỉ tồn tại sau khi auth system hoạt động
  #   impacts:
  #     - DASHBOARD_001  # Dashboard dùng user data
  #     - SETTINGS_001   # Settings gắn với user profile
  #   description: "User profile management"
  #
  # SESSION_001:
  #   depends_on:
  #     - AUTH_001    # Session lifecycle phụ thuộc vào auth
  #   impacts:
  #     - API_GATEWAY_001  # Mọi API call cần valid session
  #   description: "Session management và token refresh"

# Visualization (ASCII):
#
#   AUTH_001
#   ├── USER_001
#   │   ├── DASHBOARD_001
#   │   └── SETTINGS_001
#   └── SESSION_001
#       └── API_GATEWAY_001
