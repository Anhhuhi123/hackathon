# Intent Registry — Organizational Queue
#
# Đây là danh sách toàn bộ intents trong hệ thống.
# Mỗi intent đại diện cho một unit of work đã được clarify
# và đang ở một trạng thái cụ thể trong pipeline.
#
# STATUS VALUES:
#   PENDING    - Đã đăng ký, chưa bắt đầu xử lý
#   PROCESSING - Đang trong pipeline (bất kỳ layer nào)
#   COMPLETED  - Đã deliver, validation passed
#   FAILED     - Validation failed, cần review
#
# RULE: Chỉ Requirement Layer được phép tạo intent mới.
#       Chỉ Validation Layer được phép set status → COMPLETED.

intents:
  - intent_id: EXAMPLE_001
    title: "Example Intent — Authentication System"
    status: COMPLETED
    created_at: "2026-05-26T00:00:00Z"
    completed_at: "2026-05-26T01:00:00Z"
    dependencies: []
    layer_status:
      requirement: COMPLETED
      architecture: COMPLETED
      frontend: COMPLETED
      backend: COMPLETED
      validation: COMPLETED
    notes: "Reference intent — demonstrates full lifecycle"

